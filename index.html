<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>The Bella Wedding</title>

 <style>
  :root {
    --wix-banner-height: 50px;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overflow-x: hidden;
    background: #ffffff;
  }

  .wix-wrapper {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #ffffff;
    width: 100vw;
    height: 100vh;
  }

  .wix-wrapper iframe {
    position: absolute;
    top: calc(-1 * var(--wix-banner-height));
    left: 0;
    width: 100%;
    height: calc(100% + var(--wix-banner-height));
    border: 0;
    margin: 0;
    padding: 0;
    display: block;
  }

  @media (max-width: 768px) {
  .wix-wrapper iframe {
    left: -28px;
    width: calc(100% + 56px);
    height: calc(100% + var(--wix-banner-height));
  }

}
  }
</style>
</head>

<body>

  <div class="wix-wrapper">
    <iframe
      src="https://thebellawedding.wixsite.com/website-3"
      title="The Bella Wedding"
      allow="fullscreen"
    ></iframe>
  </div>

</body>
</html>
